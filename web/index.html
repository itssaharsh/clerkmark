<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clerkmark · citation memo</title>
<meta name="description" content="Clerkmark writes the clerk's red-pen memo over a filed brief's citations: each case looked up in a free law library, each row printed with the rule that decided it.">
<meta name="theme-color" content="#FCFBF7">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,700;1,8..60,400&display=swap">
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/print.css" media="print">
</head>
<body>
<a class="skip" href="#main">Skip to the memo</a>

<div class="table">
  <p id="banner" class="banner" hidden></p>

  <div class="tabs" role="tablist" aria-label="Sheets">
    <button type="button" role="tab" id="tab-memo" class="tab" aria-selected="true" aria-controls="panel-memo" data-hash="memo">Memo</button>
    <button type="button" role="tab" id="tab-evaluation" class="tab" aria-selected="false" aria-controls="panel-evaluation" data-hash="evaluation" tabindex="-1">Evaluation</button>
    <button type="button" role="tab" id="tab-how" class="tab" aria-selected="false" aria-controls="panel-how" data-hash="how" tabindex="-1">How it works</button>
  </div>

  <main id="main" class="sheet" tabindex="-1">

    <section id="panel-memo" class="panel" role="tabpanel" aria-labelledby="tab-memo">
      <header class="heading ln">
        <div class="heading-grid">
          <div class="heading-lines">
            <h1 id="memo-title" class="memo-h1"></h1>
            <dl class="hl">
              <div><dt id="k-to"></dt><dd id="v-to"></dd></div>
              <div><dt id="k-from"></dt><dd id="v-from"></dd></div>
              <div><dt id="k-re"></dt><dd id="v-re"></dd></div>
              <div><dt id="k-date"></dt><dd id="v-date"></dd></div>
              <div><dt id="k-against"></dt><dd id="v-against"></dd></div>
            </dl>
          </div>
          <div class="heading-right">
            <div id="stamp" class="stamp" hidden></div>
            <label id="drop-own" class="button-primary" hidden><span id="drop-own-label"></span><input type="file" id="file-own" accept="application/pdf,.pdf"></label>
          </div>
        </div>
        <div class="double-rule" aria-hidden="true"></div>
        <p id="disclaimer" class="disclaimer"></p>
        <p id="litigant" class="litigant"></p>
      </header>

      <div class="body">
        <div id="status" class="status ln" role="status" aria-live="polite">
          <div id="status-inner" class="status-inner"></div>
        </div>
        <div id="drop" class="drop ln" hidden><div id="drop-inner" class="drop-inner"></div></div>
        <ol id="rows" class="rows" aria-label="Citations in filing order"></ol>
        <div id="notice" class="notice ln" hidden><p id="notice-inner" class="notice-inner"></p></div>
        <div id="foot" class="foot ln" hidden><p id="foot-inner" class="foot-inner"></p></div>
        <div id="footlinks" class="footlinks ln" hidden><p id="footlinks-inner"></p></div>
      </div>
    </section>

    <section id="panel-evaluation" class="panel" role="tabpanel" aria-labelledby="tab-evaluation" hidden>
      <div id="eval" class="eval ln"></div>
    </section>

    <section id="panel-how" class="panel" role="tabpanel" aria-labelledby="tab-how" hidden>
      <div id="how" class="how ln"></div>
    </section>

    <p id="print-footer" class="print-footer" aria-hidden="true"></p>
  </main>

  <p id="credits" class="credits"></p>
</div>

<script src="/static/app.js" defer></script>
</body>
</html>
