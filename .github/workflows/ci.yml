# CI — the offline suite: unit + integration tests, the PASS/FAIL demo proof, the README check.
# Nothing here needs the network beyond pip: the seeded sample runs from the committed CAP cache.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Demo proof (offline PASS/FAIL, AC-7)
        run: CITEMEMO_OFFLINE=1 bash scripts/verify.sh
      - name: README check (AC-14)
        run: bash scripts/check_readme.sh
